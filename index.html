<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parmpreet Singh, Fullstack Software Developer & Team Lead. 3+ years building scalable web apps and AI-powered features with React, TypeScript, Next.js, Node.js, and AWS." />
    <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parmpreet Singh | Fullstack Software Developer" />
    <meta property="og:description" content="Full-stack team lead building scalable web apps & AI-powered products with React, TypeScript, Node.js and AWS." />
    <meta name="twitter:card" content="summary" />
    <title>Parmpreet Singh | Fullstack Software Developer</title>

    <!-- Apply the saved theme before first paint so there is no flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
